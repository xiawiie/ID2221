schema_version: "2"

source_dataset_dependencies:
  taxi_trips:
    products:
      - daily_mobility_summary
      - taxi_zone_monthly_statistics
      - weather_impact_summary
      - air_quality_impact_summary
    month_scope: taxi_incremental_pickup_months
  weather_hourly:
    products:
      - weather_impact_summary
    month_scope: weather_trip_overlap_months
  air_quality_hourly_nyc:
    products:
      - air_quality_impact_summary
    month_scope: air_trip_overlap_months

products:
  daily_mobility_summary:
    partition_columns: [pickup_month]
    refresh_mode: partition_replace
    merge_keys: [pickup_month, service_date, pickup_borough]
    source_datasets: [taxi_trips]
  taxi_zone_monthly_statistics:
    partition_columns: [pickup_month]
    refresh_mode: partition_replace
    merge_keys: [pickup_month, pickup_zone, pickup_borough]
    source_datasets: [taxi_trips]
  weather_impact_summary:
    partition_columns: [pickup_month]
    refresh_mode: partition_replace
    merge_keys: [pickup_month, weather_condition]
    source_datasets: [taxi_trips, weather_hourly]
  air_quality_impact_summary:
    partition_columns: [pickup_month]
    refresh_mode: full_partition
    merge_keys: [pickup_month, service_date]
    source_datasets: [taxi_trips, air_quality_hourly_nyc]
